<!doctype html>
<html lang="en" data-theme="{{ 'light' if cfg.ui.theme=='light' else ('dark' if cfg.ui.theme=='dark' else '') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
RSSgate</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#2733c6">

<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <button id="menu-btn" class="icon-btn" aria-label="menu">&#9776;</button>
  <span class="brand">RSS<span>gate</span></span>
  <span class="spacer"></span>
  <button id="refresh-btn" class="icon-btn" title="Refresh feeds now">&#x21bb;</button>
  <a href="/admin" class="icon-btn" title="Admin">&#9881;</a>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="seg" role="tablist">
      <button id="mode-new" class="active" role="tab">New</button>
      <button id="mode-since" role="tab">Since</button>
    </div>
    <div id="since-ctrl" hidden>
      <input type="date" id="since-date">
      <div class="presets">
        <button class="btn ghost sm" data-days="1">24h</button>
        <button class="btn ghost sm" data-days="7">7d</button>
        <button class="btn ghost sm" data-days="30">30d</button>
        <button class="btn ghost sm" data-days="90">90d</button>
      </div>
    </div>
    <h3>Feed Categories</h3>
    <div id="feedcat-filter" class="cat-filter"></div>
    <h3>Feeds by Name</h3>
    <ul id="feed-filter"><li data-feed="" class="active">All feeds</li></ul>
    <h3>Post Categories</h3>
    <div id="cat-filter" class="cat-filter"></div>
  </aside>
  <div id="sidebar-veil"></div>

  <main id="stream" aria-live="polite"></main>
</div>

<div id="new-above" class="new-above" hidden>
  <button id="new-above-btn" class="btn">&#8679; New articles above &mdash; jump to newest#8681; Continue reading</button>
</div>

<div id="end-banner" class="end-banner" hidden>
  <div id="end-new">
    <p class="end-title">You've seen it all!</p>
    <p class="end-sub">Jump back to a specific date:</p>
    <div class="date-jump">
      <input type="date" id="jump-date">
      <button id="jump-btn" class="btn">Go</button>
      <button id="back-btn" class="btn ghost">Back to now</button>
    </div>
  </div>
  <div id="end-since" hidden>
    <p class="end-title" id="end-since-text">That's everything.</p>
    <button id="back-now-btn" class="btn">Back to new</button>
  </div>
</div>

<p id="empty-hint" class="empty-hint" hidden>No articles yet.
  <a href="/admin">Add some feeds in the admin panel</a> and hit refresh.</p>

<div id="sentinel" style="height:1px"></div>
<script>window.RSSGATE_PAGE = {{ cfg.ui['items_per_page'] }};</script>
<script src="/static/viewer.js"></script>
</body>
</html>
